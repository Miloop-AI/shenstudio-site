<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{SEO}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F2;
    --band:#EDF1EE;
    --ink:#12191B;
    --ink-soft:#4E5B5E;
    --accent:#0B4A5A;
    --teal:#083B49;
    --muted:#657172;
    --line:#E2DFD5;
    --thumb:#083B49;
    --on-teal:#F4F1EA;
    --on-teal-soft:#A9C6CD;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;line-height:1.7;
    -webkit-font-smoothing:antialiased;}
  .serif{font-family:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",Georgia,serif;}
  .mono{font-family:"SF Mono","Consolas","Menlo",monospace;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  .wrap-wide{max-width:1040px;margin:0 auto;padding:0 24px;}
  a{color:inherit;text-decoration:none;}

  nav{border-bottom:1px solid var(--line);}
  .navwrap{position:relative;display:flex;align-items:center;justify-content:space-between;height:72px;}
  .logo{display:flex;align-items:center;}
  .logo-img{height:30px;width:auto;display:block;}
  .navcheck{position:absolute;opacity:0;pointer-events:none;}
  .navtoggle{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:10px;margin:-10px;}
  .navtoggle span{width:20px;height:1.5px;background:var(--ink);display:block;}
  .navlinks{display:none;position:absolute;top:72px;left:0;right:0;background:var(--paper);
    flex-direction:column;border-bottom:1px solid var(--line);padding:6px 24px 20px;z-index:20;}
  .navlinks a{padding:14px 0;font-size:15px;border-top:1px solid var(--line);}
  .navlinks a:first-child{border-top:none;}
  .navcheck:checked ~ .navlinks{display:flex;}
  @media(min-width:820px){
    .navtoggle{display:none;}
    .navlinks{display:flex !important;position:static;flex-direction:row;background:none;border:none;
      padding:0;gap:28px;align-items:center;}
    .navlinks a{padding:0;border:none;font-size:13px;color:var(--ink-soft);}
    .navlinks a:hover{color:var(--accent);}
  }

  /* banner strip, same proportions as her YouTube banner */
  .heroimg{aspect-ratio:10/3;background:var(--thumb) center/cover no-repeat;}
  @media(min-width:820px){.heroimg{aspect-ratio:2560/423;}}

  /* intro */
  .intro{background:var(--band);padding:44px 0 0;text-align:center;}
  .intro .lead{font-size:22px;font-weight:600;line-height:1.55;max-width:560px;margin:0 auto;text-wrap:balance;}
  .intro .clause{display:inline-block;}
  .intro .topics{font-size:13px;letter-spacing:1px;color:var(--ink-soft);margin:14px auto 0;max-width:560px;line-height:1.9;}
  .subscribe{margin-top:36px;padding:16px 0;border-top:1px solid #D5DCD7;font-size:13px;color:var(--ink-soft);
    display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;}
  .subscribe b{color:var(--ink);font-weight:600;letter-spacing:2px;font-size:12px;}
  .subscribe a:hover{color:var(--accent);}
  @media(min-width:820px){
    .intro{padding-top:60px;}
    .intro .lead{font-size:30px;max-width:720px;}
    .intro .topics{font-size:14px;max-width:none;}
  }

  /* main list + side column */
  .layout{padding:8px 24px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;}
  @media(min-width:820px){
    .layout{grid-template-columns:minmax(0,1fr) 260px;gap:72px;padding-top:24px;}
  }
  .fhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);
    padding:32px 0 12px;}
  main .fhead + .ep + .fhead{padding-top:40px;}
  .fhead h2{font-size:12px;letter-spacing:3px;color:var(--ink-soft);font-weight:600;}
  .fhead a{font-size:12px;color:var(--muted);}
  .fhead a:hover{color:var(--accent);}

  .ep{padding:28px 0;border-top:1px solid var(--line);}
  .ep:first-of-type{border-top:none;}
  .ep .eyebrow{font-size:12px;color:var(--accent);margin-bottom:8px;letter-spacing:.5px;}
  .ep h3{font-size:20px;font-weight:700;line-height:1.5;}
  .ep h3 a:hover{color:var(--accent);}
  .ep .deck{font-size:15px;color:var(--ink-soft);margin-top:10px;line-height:1.75;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;}
  .ep .meta{font-size:12px;color:var(--muted);margin-top:14px;}
  .ep .tags{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.8;}
  .ep.lead{padding:32px 0 36px;}
  .ep.lead h3{font-size:24px;}
  .ep.lead .deck{font-size:16px;-webkit-line-clamp:3;line-clamp:3;}
  @media(min-width:820px){
    .ep h3{font-size:22px;}
    .ep.lead h3{font-size:30px;line-height:1.45;}
    .ep.lead .deck{font-size:17px;}
  }

  aside .box{padding-bottom:8px;}
  aside .box p{font-size:14px;color:var(--ink-soft);line-height:1.75;padding-top:14px;}
  aside .box .more{display:inline-block;font-size:12px;color:var(--accent);margin-top:10px;}
  aside .box .more:hover{text-decoration:underline;}
  aside .box.muted p{color:var(--ink-soft);}

  footer{padding:48px 0 40px;background:var(--teal);color:var(--on-teal);}
  footer .tagline{font-size:13px;color:var(--on-teal);margin-bottom:28px;max-width:420px;}
  footer .cols{display:flex;gap:48px;font-size:13px;margin-bottom:32px;}
  footer h5{font-size:11px;letter-spacing:2px;color:var(--on-teal-soft);margin-bottom:12px;}
  footer ul{list-style:none;}
  footer li{margin-bottom:8px;}
  footer a:hover{text-decoration:underline;}
  .copyright{font-size:11px;color:var(--on-teal-soft);}
</style>
</head>
<body>

<nav>
  <div class="wrap navwrap">
    <a href="#" class="logo">
      <img src="{{LOGO}}" alt="大道传媒 Shen Studio" class="logo-img">
    </a>
    <input type="checkbox" id="navcheck" class="navcheck">
    <label for="navcheck" class="navtoggle" aria-label="菜单"><span></span><span></span><span></span></label>
    <div class="navlinks">
      <a href="#episodes">播客</a>
      <a href="#video">影片</a>
      <a href="#about">关于</a>
    </div>
  </div>
</nav>

<div class="heroimg" role="img" aria-label="沈琛琛 Cici Shen | 大道传媒" style="background-image:url('{{HERO}}')"></div>

<header class="intro" id="about">
  <div class="wrap">
    <h1 class="lead serif"><span class="clause">旧金山湾区著名媒体人沈琛琛，</span> <span class="clause">立足硅谷，放眼全球。</span></h1>
    <p class="topics">深度时事解析 × 财经干货访谈 × 硅谷前沿科技 × 大健康养生</p>
    <div class="subscribe">
      <b>收听</b>
      <a href="https://open.spotify.com/show/033R7udpl2Dr1qmaoNHATs" target="_blank" rel="noopener">Spotify</a>
      <a href="https://podcasts.apple.com/us/podcast/c%E6%83%B3%E4%B8%80%E5%88%BB/id6791887956" target="_blank" rel="noopener">Apple Podcast</a>
      <a href="{{PODCAST_HOME}}" target="_blank" rel="noopener">Podbean</a>
    </div>
  </div>
</header>

<div class="wrap-wide layout">
  <main id="episodes">
    <div class="fhead"><h2>最新发布</h2></div>
{{LATEST}}
    <div class="fhead"><h2>全部内容</h2><a href="{{PODCAST_HOME}}" target="_blank" rel="noopener">全部节目 ›</a></div>
{{ROWS}}
  </main>

  <aside>
    <section class="box muted" id="video">
      <div class="fhead"><h2>影片</h2><a href="{{YT}}" target="_blank" rel="noopener">YouTube ›</a></div>
      <p>{{VIDEO_TEXT}}</p>
    </section>
  </aside>
</div>

<footer>
  <div class="wrap">
    <div class="tagline serif">写给湾区华人的独立媒体观察</div>
    <div class="cols">
      <div><h5>内容</h5><ul><li>播客</li><li>影片</li></ul></div>
      <div><h5>关注我们</h5><ul><li>IG</li><li><a href="{{YT}}" target="_blank" rel="noopener">YT</a></li><li>FB</li></ul></div>
    </div>
    <div class="copyright">© 2026 大道传媒 Shen Studio</div>
  </div>
</footer>

</body>
</html>
